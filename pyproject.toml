[project]
name = "powerclock"
dynamic = ["version"]
description = "Shutdown, wake-up and task scheduler: power off, suspend, turn on and run tasks at a time or when something happens, with persistent rules."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["shutdown", "suspend", "hibernate", "wake", "wake-up", "power-on", "rtcwake", "scheduler", "timer", "automation", "power-management", "kde", "linux"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Natural Language :: English",
    "Natural Language :: Spanish",
    "Topic :: System :: Power (UPS)",
    "Topic :: Utilities",
]
dependencies = [
    "croniter>=6.2.4",
    "dbus-fast>=5.0.22 ; sys_platform == 'linux'",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "platformdirs>=4.11.12",
    "psutil>=7.2.2",
    "pydantic>=2.13.5",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "uvicorn>=0.53.0",
    "websockets>=17.1",
]

[project.urls]
Homepage = "https://github.com/solucionesconscientes/powerclock"
Documentation = "https://github.com/solucionesconscientes/powerclock#readme"
Repository = "https://github.com/solucionesconscientes/powerclock"
Issues = "https://github.com/solucionesconscientes/powerclock/issues"
Changelog = "https://github.com/solucionesconscientes/powerclock/blob/main/CHANGELOG.md"

[project.scripts]
powerclock = "powerclock.cli.main:app"
powerclock-daemon = "powerclock.daemon.main:main"

[project.gui-scripts]
powerclock-gui = "powerclock.gui.app:main"  # no console window on Windows

[project.optional-dependencies]
gui = [
    "pyside6-essentials>=6.11.2",
    "qasync>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/powerclock/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/powerclock"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["*.md"]  # docs keep their own layout

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["powerclock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # tests/support.py
addopts = ["-m", "not real", "--strict-markers", "--import-mode=importlib"]
markers = ["real: touches the real system (power, D-Bus, RTC); excluded by default"]
filterwarnings = [
    "error",
    # FastAPI's TestClient still wraps httpx, which Starlette now deprecates; tests only.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
    "time-machine>=3.5.1",
]
