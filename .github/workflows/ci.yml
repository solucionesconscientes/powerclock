name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        arch: [x86-64]
        runner: [ubuntu-latest]
        include:
          # PowerClock is pure Python, but its dependencies are not: this checks that Qt,
          # pydantic and psutil really do install and run on ARM.
          - python: "3.13"
            arch: arm64
            runner: ubuntu-24.04-arm
    env:
      QT_QPA_PLATFORM: offscreen  # the GUI tests never open a window
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Libraries Qt needs on a bare runner
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync --all-extras --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -m "not real"

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: The Linux installer script
        run: shellcheck --shell=sh installers/install-powerclock.sh
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
